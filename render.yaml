services:
  - type: web
    name: smart-consulta-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DB_SSL
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smart-consulta-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_SECURE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: smart-consulta-db
    plan: free
    databaseName: smart_consulta
    user: smart_consulta
